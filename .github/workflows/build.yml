name: Build
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/NINA.Plugin.ShutdownButton/NINA.Plugin.ShutdownButton.csproj
      - name: Build
        run: dotnet build src/NINA.Plugin.ShutdownButton/NINA.Plugin.ShutdownButton.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/NINA.Plugin.ShutdownButton.Tests/NINA.Plugin.ShutdownButton.Tests.csproj -c Release
