name: Build and Package
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/NINA.Plugin.ShutdownButton.Tests/NINA.Plugin.ShutdownButton.Tests.csproj
      - name: Build
        run: dotnet build src/NINA.Plugin.ShutdownButton/NINA.Plugin.ShutdownButton.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/NINA.Plugin.ShutdownButton.Tests/NINA.Plugin.ShutdownButton.Tests.csproj -c Release
      - name: Validate N.I.N.A. catalogue release packaging
        if: hashFiles('build/Make-Release.ps1') != ''
        shell: pwsh
        run: |
          ./build/Make-Release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag v0.1.0.0
          if ($LASTEXITCODE) { throw 'Catalogue release packaging failed' }
          $manifest = @(Get-ChildItem dist -Filter '*.manifest.json')
          if ($manifest.Count -ne 1) { throw 'Missing catalogue manifest' }
          $data = Get-Content $manifest[0].FullName -Raw | ConvertFrom-Json
          if ($data.Installer.Checksum -ne (Get-FileHash dist/*.zip -Algorithm SHA256).Hash) { throw 'Manifest checksum mismatch' }
      - name: Package installable plugin
        shell: pwsh
        run: |
          $source = "src/NINA.Plugin.ShutdownButton/bin/Release/net8.0-windows"
          if (!(Test-Path "$source/NINA.Plugin.ShutdownButton.dll")) { throw "Plugin DLL missing" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$source/NINA.Plugin.ShutdownButton.dll" package/
          Copy-Item "README.md" package/
          Copy-Item "docs/TESTING.md" package/TESTING.md
          Compress-Archive -Path package/* -DestinationPath "NINA.Plugin.ShutdownButton.zip" -Force
      - name: Upload installable ZIP and DLL
        uses: actions/upload-artifact@v4
        with:
          name: nina-shutdown-button-windows
          path: |
            NINA.Plugin.ShutdownButton.zip
            package/NINA.Plugin.ShutdownButton.dll
          if-no-files-found: error
